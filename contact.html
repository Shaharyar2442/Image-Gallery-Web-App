<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gothic Architecture Gallery - Contact</title>
</head>

<body
    style="background-color: #121212; color: #e0e0e0; font-family: 'Times New Roman', serif; margin: 0; padding: 20px; text-align: center;">

    <header>
        <h1 style="color: #ffffff; font-size: 3em; margin-bottom: 10px;">Gothic Architecture Gallery</h1>
    </header>

    <nav style="font-family: Arial, sans-serif; font-size: 1.2em; margin-bottom: 20px;">
        <a href="index.html" style="color: #a6a6a6; text-decoration: none; margin: 0 10px;">Home</a> |
        <a href="about.html" style="color: #a6a6a6; text-decoration: none; margin: 0 10px;">About</a> |
        <a href="signup.html" style="color: #a6a6a6; text-decoration: none; margin: 0 10px;">Sign Up</a> |
        <a href="signin.html" style="color: #a6a6a6; text-decoration: none; margin: 0 10px;">Sign In</a> |
        <a href="contact.html" style="color: #a6a6a6; text-decoration: none; margin: 0 10px;">Contact</a>
    </nav>

    <hr style="width: 80%; border-color: #5c5c5c; margin: 20px auto;">

    <main>
        <section>
            <h2 style="font-size: 2em; margin-bottom: 10px;">Contact Us</h2>
            <p style="font-size: 1.1em;">Share your thoughts or inquire about the gallery.</p>
        </section>

        <div
            style="background-color: #1E1E1E; border: 1px solid #5c5c5c; padding: 40px; margin: 40px auto; width: 400px; max-width: 90%;">
            <form>
                <div style="margin-bottom: 15px; text-align: left;">
                    <label for="name"
                        style="font-family: Arial, sans-serif; display: block; margin-bottom: 5px;">Name:</label>
                    <input type="text" id="name" name="name" style="width: 100%; padding: 8px; box-sizing: border-box;">
                </div>

                <div style="margin-bottom: 15px; text-align: left;">
                    <label for="email"
                        style="font-family: Arial, sans-serif; display: block; margin-bottom: 5px;">Email:</label>
                    <input type="text" id="email" name="email"
                        style="width: 100%; padding: 8px; box-sizing: border-box;">
                </div>

                <div style="margin-bottom: 20px; text-align: left;">
                    <label for="message"
                        style="font-family: Arial, sans-serif; display: block; margin-bottom: 5px;">Message:</label>
                    <textarea id="message" name="message" rows="5"
                        style="width: 100%; padding: 8px; box-sizing: border-box;"></textarea>
                </div>

                <input type="submit" value="Send Message"
                    style="background-color: #333; color: #fff; border: 1px solid #5c5c5c; padding: 10px 20px; cursor: pointer; font-size: 1em;">
            </form>
        </div>
    </main>

    <footer style="margin-top: 60px;">
        <hr style="width: 80%; border-color: #5c5c5c; margin: 20px auto;">
        <p style="font-family: Arial, sans-serif; font-size: 0.9em;">&copy; 2026 Gothic Gallery. All rights reserved.
        </p>
    </footer>

</body>

</html>
